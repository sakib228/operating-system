<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signin || e-commerce page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="shortcut icon" href="e-commerec.png" type="image/x-icon" />
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body class="google-sans-body">
    <form action="" class="container">
      <div class="card_container">
        <div class="card_head">SIGN UP</div>
        <div class="card_body">
          <label for="fname" class="color">First Name</label>
          <input
            type="text"
            name="fname"
            class="sign_email"
            placeholder="First Name"
            required
          />
          <label for="fname" class="color">Last Name</label>
          <input
            type="text"
            name="fname"
            class="sign_email"
            placeholder="Last Name"
            required
          />
          <!-- <label for="mail">Last Name</label>
          <input
            type="text"
            name="mail"
            class="sign_email"
            placeholder="Last Name"
            required
          /> -->
          <label for="mail" class="color">Email Address</label>
          <input
            type="email"
            name="mail"
            class="sign_email"
            placeholder="User Email"
            required
          />
          <label for="mail" class="color">Mobile Number</label>
          <input
            type="tel"
            name="mail"
            class="sign_email"
            placeholder="Mobile Number"
            required
          />
          <label for="pass" class="color">Password</label>
          <input
            type="password"
            name="pass"
            class="sign_pass"
            placeholder="User Password"
            required
          />
        </div>
        <button class="btn" type="submit">Complete</button>

        <div class="foot">
          <div class="one"><a href="login.html">Sign in </a></div>
          <div class="tow"><a href="#">Forgot</a></div>
        </div>
      </div>
    </form>
  </body>
</html>
